<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You Chesa ❤️</title>
<style>
  :root {
    --cream: #FFF8EC;
    --gold: #F5A623;
    --petal: #FFCC44;
    --petal-dark: #E8A000;
    --stem: #5A8A3C;
    --leaf: #6AAF42;
    --brown: #5C3A1E;
    --text-main: #3B2208;
    --text-soft: #7A5C3A;
    --card-bg: rgba(255, 255, 255, 0.72);
    --shadow: rgba(90, 50, 10, 0.12);

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream: #2A1F0E;
      --card-bg: rgba(50, 35, 15, 0.82);
      --text-main: #F5E6CC;
      --text-soft: #C9A97A;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  body {
    min-height: 100vh;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(245,166,35,0.13) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(245,166,35,0.10) 0%, transparent 55%);
  }

  /* ── Fade-up animation ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes petalWave {
    0%, 100% { transform: rotate(var(--r)) scale(1); }
    50%       { transform: rotate(calc(var(--r) + 4deg)) scale(1.04); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-2deg); }
    50%       { transform: rotate(2deg); }
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.55; }
    50%       { opacity: 1; }
  }

  .fade-up {
    opacity: 0;
    animation: fadeUp 0.9s ease forwards;
  }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.35s; }
  .delay-3 { animation-delay: 0.6s; }
  .delay-4 { animation-delay: 0.85s; }
  .delay-5 { animation-delay: 1.1s; }

  @media (prefers-reduced-motion: reduce) {
    .fade-up { opacity: 1; animation: none; }
    .petal, .stem-wrap { animation: none !important; }
  }

  /* ── Sunflower ── */
  .flower-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2.5rem;
  }

  .sunflower {
    position: relative;
    width: 160px;
    height: 160px;
    animation: sway 4s ease-in-out infinite;
    transform-origin: center bottom;
  }

  .petal {
    position: absolute;
    width: 38px;
    height: 70px;
    background: linear-gradient(to bottom, var(--petal), var(--petal-dark));
    border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
    left: 50%;
    top: 50%;
    transform-origin: center bottom;
    margin-left: -19px;
    margin-top: -60px;
    animation: petalWave 3.2s ease-in-out infinite;
    box-shadow: 0 2px 6px rgba(200,120,0,0.18);
  }

  /* 12 petals, evenly spaced */
  .petal:nth-child(1)  { --r: 0deg;    transform: rotate(0deg)   translateY(-38px); animation-delay: 0s; }
  .petal:nth-child(2)  { --r: 30deg;   transform: rotate(30deg)  translateY(-38px); animation-delay: 0.15s; }
  .petal:nth-child(3)  { --r: 60deg;   transform: rotate(60deg)  translateY(-38px); animation-delay: 0.30s; }
  .petal:nth-child(4)  { --r: 90deg;   transform: rotate(90deg)  translateY(-38px); animation-delay: 0.45s; }
  .petal:nth-child(5)  { --r: 120deg;  transform: rotate(120deg) translateY(-38px); animation-delay: 0.60s; }
  .petal:nth-child(6)  { --r: 150deg;  transform: rotate(150deg) translateY(-38px); animation-delay: 0.75s; }
  .petal:nth-child(7)  { --r: 180deg;  transform: rotate(180deg) translateY(-38px); animation-delay: 0.90s; }
  .petal:nth-child(8)  { --r: 210deg;  transform: rotate(210deg) translateY(-38px); animation-delay: 1.05s; }
  .petal:nth-child(9)  { --r: 240deg;  transform: rotate(240deg) translateY(-38px); animation-delay: 1.20s; }
  .petal:nth-child(10) { --r: 270deg;  transform: rotate(270deg) translateY(-38px); animation-delay: 1.35s; }
  .petal:nth-child(11) { --r: 300deg;  transform: rotate(300deg) translateY(-38px); animation-delay: 1.50s; }
  .petal:nth-child(12) { --r: 330deg;  transform: rotate(330deg) translateY(-38px); animation-delay: 1.65s; }

  .flower-center {
    position: absolute;
    width: 68px;
    height: 68px;
    background: radial-gradient(circle at 38% 38%, #7B4A1A, var(--brown) 60%, #3A1E08);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 14px rgba(60,20,0,0.35), inset 0 2px 6px rgba(255,200,100,0.15);
    z-index: 2;
  }

  /* Seed pattern dots */
  .flower-center::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at center,
      rgba(255,200,80,0.18) 0px,
      rgba(255,200,80,0.18) 2px,
      transparent 2px,
      transparent 7px
    );
  }

  .stem-wrap {
    width: 10px;
    height: 90px;
    background: linear-gradient(to bottom, var(--stem), #3d6128);
    border-radius: 5px;
    position: relative;
    animation: sway 4s ease-in-out infinite;
    transform-origin: center bottom;
  }

  .leaf {
    position: absolute;
    width: 44px;
    height: 22px;
    background: linear-gradient(135deg, var(--leaf), #3d6128);
    border-radius: 50% 0 50% 0;
    top: 24px;
  }

  .leaf.left  { right: 6px; transform: rotate(-25deg) scaleX(-1); }
  .leaf.right { left: 6px; transform: rotate(25deg); }

  /* ── Card ── */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(245, 166, 35, 0.22);
    border-radius: 24px;
    padding: 2.4rem 2rem 2rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px var(--shadow), 0 2px 8px rgba(245,166,35,0.10);
    position: relative;
    overflow: hidden;
  }

  /* Corner accents */
  .card::before, .card::after {
    content: '🌻';
    position: absolute;
    font-size: 1.3rem;
    opacity: 0.28;
  }
  .card::before { top: 14px; left: 18px; transform: rotate(-18deg); }
  .card::after  { bottom: 14px; right: 18px; transform: rotate(12deg); }

  .label {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: var(--gold);
    margin-bottom: 1.4rem;
    font-family: 'Georgia', serif;
    font-style: italic;
  }

  .line {
    color: var(--text-main);
    line-height: 1.65;
    margin-bottom: 1.1rem;
  }

  .line-1 {
    font-size: clamp(1rem, 4vw, 1.15rem);
    color: var(--text-soft);
    font-style: italic;
  }

  .line-2 {
    font-size: clamp(1rem, 4vw, 1.13rem);
    color: var(--text-soft);
    font-style: italic;
  }

  .line-3 {
    font-size: clamp(1.55rem, 6vw, 2rem);
    font-weight: 700;
    color: var(--text-main);
    margin-top: 1.5rem;
    margin-bottom: 0;
    letter-spacing: -0.01em;
    animation: shimmer 3s ease-in-out infinite;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 1.2rem auto;
    border-radius: 2px;
  }
</style>
</head>
<body>

  <div class="flower-wrap fade-up delay-1">
    <div class="sunflower">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="flower-center"></div>
    </div>
    <div class="stem-wrap">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>
  </div>

  <div class="card">
    <p class="label fade-up delay-2">a note for you</p>

    <p class="line line-1 fade-up delay-3">Thanks for always staying by my side.</p>

    <div class="divider fade-up delay-3"></div>

    <p class="line line-2 fade-up delay-4">Please always stay with me.</p>

    <p class="line line-3 fade-up delay-5">I love you ♡</p>
  </div>

</body>
</html>
